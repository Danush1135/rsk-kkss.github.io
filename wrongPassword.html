<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Amaran</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #ff6f91, #ff8c00);
        flex-direction: column;
        text-align: center;
        margin: 0;
        color: #fff;
    }
    .warning {
        color: #fff;
        font-size: 24px;
        font-weight: bold;
        background: rgba(255, 255, 255, 0.2);
        padding: 25px 35px;
        border: 3px solid #fff;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0px 8px 18px rgba(0, 0, 0, 0.3);
        animation: shake 0.5s ease-in-out infinite alternate;
        backdrop-filter: blur(8px);
    }
    .warning-icon {
        font-size: 36px;
    }
    a {
        margin-top: 30px;
        text-decoration: none;
        font-size: 20px;
        color: #fff;
        background: linear-gradient(135deg, #00b0ff, #0077b6);
        padding: 14px 28px;
        border-radius: 8px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    a:hover {
        transform: scale(1.1);
        box-shadow: 0px 6px 18px rgba(0, 120, 255, 0.6);
        background: linear-gradient(135deg, #0077b6, #00b0ff);
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        50% { transform: translateX(8px); }
        75% { transform: translateX(-8px); }
    }
</style>
</head>
<body>
    <div class="warning">
        <span class="warning-icon">⚠️</span>
        Password Salah! Sila cuba lagi.
    </div>
    <br>
    <a href="LamanUtama.php">Kembali</a>
</body>
</html>
